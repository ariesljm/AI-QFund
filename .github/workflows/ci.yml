name: Build and Push Docker Image

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/ariesljm/ai-qfund:latest
            ghcr.io/ariesljm/ai-qfund:${{ github.sha }}

      - name: 清理旧镜像（保留最新 5 个）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api /user/packages/container/ai-qfund/versions --jq '.[].id' | tail -n +6 | xargs -r -I{} \
            gh api -X DELETE "/user/packages/container/ai-qfund/versions/{}" --silent || true
