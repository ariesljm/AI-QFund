# AI-QFund 项目配置文件
# 仅保留用户需要填写/可调的参数；数据源接口等实现细节已内置在代码中。

# ============ LLM 配置（OpenAI 兼容接口） ============
[llm]
# API 基地址，兼容任意 OpenAI 格式服务（如本地 Ollama、第三方代理）
base_url = "http://192.168.1.222:20128/v1"
# API 密钥；接入 LLM 前必须填入
api_key = "sk-504b55bfddc021bc-7f4de9-59f7c582"
# 使用的模型名称
model = "alpha-radar"

# ============ 管线定时启动（每日指定时间运行推荐管线） ============
# hour 设为空字符串表示关闭定时
[scheduler]
hour = 8
minute = 0

# ============ Web 服务 ============
[web]
port = 9123
# 设置页面访问密码（留空则不设密码）
settings_password = ""
