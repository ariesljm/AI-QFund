[project]
name = "ai-qfund"
version = "0.1.0"
description = "AI 驱动的基金量化投研系统"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "numpy",
    "pandas",
    "lightgbm",
    "fastapi",
    "jinja2",
    "openai",
    "curl-cffi>=0.15.0",
    "tls-client>=1.0.1",
    "aiohttp>=3.14.1",
    "uvicorn>=0.51.0",
    "akshare>=1.18.81",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
